apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: sealship-demo
  labels:
    app: demo-app
    sealship.io/workload: "protected"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        sealship.io/workload: "protected"
    spec:
      containers:
      - name: demo-app
        image: localhost:5001/demo-app:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  namespace: sealship-demo
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
